<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Quiz - Hanzi Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/e9b67abd52.js" crossorigin="anonymous"></script>
</head>
<body data-page="popquiz">
  <header id="site-header"></header>

  <main class="page">
    <h1>Pop Quiz</h1>
    <p class="breadcrumb">Practice writing any character from any chapter/unit</p>

    <section class="panel">
      <div class="quiz-config">
        <label>
          Textbook
          <select id="quiz-book-select"></select>
        </label>
        <label>
          Unit
          <select id="quiz-unit-select"></select>
        </label>
        <label>
          Chapter
          <select id="quiz-chapter-select"></select>
        </label>
        <label>
          Number of characters: <span id="quiz-count-value">20</span>
          <input type="range" id="quiz-count" min="10" max="100" step="5" value="20">
        </label>
        <button id="start-random-quiz"> Start Pop Quiz</button>
      </div>
      <p id="quiz-config-note" class="breadcrumb"></p>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="common.js"></script>
  <script src="pop-quiz.js"></script>
</body>
</html>
