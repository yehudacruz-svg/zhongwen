<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hanzi Learning</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>汉字 Hanzi Learning</h1>
  <p class="breadcrumb">Dev build</p>

  <section class="panel">
    <h2>Search a character</h2>
    <input type="text" id="search-input" placeholder="Type a character, pinyin, or meaning…" autocomplete="off">
    <div id="search-results"></div>
  </section>


  <h2>Units</h2>
  <div id="units"></div>

    <section class="panel">
    <h2>Pop Quiz</h2>
    <div class="quiz-config">
      <label>
        Scope — Unit
        <select id="quiz-unit-select"></select>
      </label>
      <label>
        Scope — Chapter
        <select id="quiz-chapter-select"></select>
      </label>
      <label>
        Number of characters: <span id="quiz-count-value">20</span>
        <input type="range" id="quiz-count" min="10" max="100" step="5" value="20">
      </label>
      <button id="start-random-quiz">Start Pop Quiz</button>
    </div>
    <p id="quiz-config-note" class="breadcrumb"></p>
  </section>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
