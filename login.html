<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Hanzi Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/e9b67abd52.js" crossorigin="anonymous"></script>
</head>
<body data-page="">
  <main class="page login-page">
    <div class="login-wrap">
      <form id="login-form" class="login-card">
        <i class="fa-solid fa-lock login-icon"></i>
        <h1>Admin Login</h1>
        <p class="breadcrumb">Sign in to access administrator permissions</p>

        <label class="login-field">
          Username
          <input type="text" id="login-username" autocomplete="username" required>
        </label>
        <label class="login-field">
          Password
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>

        <p id="login-error" class="login-error"></p>

        <button type="submit">Log In</button>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
