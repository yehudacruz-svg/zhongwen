<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chinese Lesson Editor</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:30px;
}

h1{
    margin-bottom:10px;
}

button{
    padding:8px 14px;
    margin:3px;
    cursor:pointer;
}

input{
    padding:6px;
    margin:4px;
    width:250px;
}

textarea{
    width:100%;
    height:60px;
    margin-top:5px;
}

.card{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
    box-shadow:0 0 6px rgba(0,0,0,.1);
}

.chapter{
    margin-left:25px;
}

.section{
    margin-left:50px;
}

.character{
    margin-left:70px;
    display:flex;
    gap:8px;
    margin-top:6px;
}

.topbar{
    margin-bottom:20px;
}

small{
    color:#777;
}
</style>
</head>
<body>

<h1>Chinese Lesson Editor</h1>

<div class="topbar">
<button onclick="addUnit()">+ Unit</button>

<button onclick="exportJSON()">Export</button>

<button onclick="document.getElementById('importFile').click()">
Import
</button>

<input type="file" id="importFile" hidden>
</div>

<div id="editor"></div>

<script>

let data={
    units:[]
};

function removeSentenceAndTranslationFields(obj){
    if(!obj || typeof obj !== "object") return;
    if(Array.isArray(obj)){
        obj.forEach(removeSentenceAndTranslationFields);
        return;
    }
    delete obj.sentence;
    delete obj.translation;
    Object.values(obj).forEach(removeSentenceAndTranslationFields);
}

const importInput=document.getElementById("importFile");

importInput.addEventListener("change",(e)=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=()=>{

data=JSON.parse(reader.result);
removeSentenceAndTranslationFields(data);

render();

}

reader.readAsText(file);

});

function generateId(prefix){
    return prefix+Math.random().toString(36).substring(2,8);
}

function addUnit(){

data.units.push({
id:generateId("u"),
title:"New Unit",
chapters:[]
});

render();

}

function addChapter(unit){

unit.chapters.push({
id:generateId(unit.id+"c"),
title:"New Chapter",
sections:[]
});

render();

}

function addSection(chapter){

chapter.sections.push({

id:generateId(chapter.id+"s"),

title:"Section",

characters:[]

});

render();

}

function addCharacter(section){

section.characters.push({

char:"",
pinyin:"",
meaning:""

});

render();

}

function render(){

const editor=document.getElementById("editor");

editor.innerHTML="";

data.units.forEach(unit=>{

const unitDiv=document.createElement("div");
unitDiv.className="card";

unitDiv.innerHTML=`

<h2>Unit</h2>

<input value="${unit.title}"

oninput="data.units.find(u=>u.id=='${unit.id}').title=this.value">

<br>

<button onclick="addChapter(data.units.find(u=>u.id=='${unit.id}'))">

+ Chapter

</button>

`;

unit.chapters.forEach(chapter=>{

const chap=document.createElement("div");

chap.className="chapter";

chap.innerHTML=`

<hr>

<h3>Chapter</h3>

<input value="${chapter.title}"

oninput="data.units.find(u=>u.id=='${unit.id}').chapters.find(c=>c.id=='${chapter.id}').title=this.value">

<br>

<button onclick="addSection(data.units.find(u=>u.id=='${unit.id}').chapters.find(c=>c.id=='${chapter.id}'))">

+ Section

</button>

`;

chapter.sections.forEach(section=>{

const sec=document.createElement("div");

sec.className="section";

sec.innerHTML=`

<hr>

<h4>Section</h4>

Title<br>

<input value="${section.title}"

oninput="data.units.find(u=>u.id=='${unit.id}')
.chapters.find(c=>c.id=='${chapter.id}')
.sections.find(s=>s.id=='${section.id}')
.title=this.value">

<br>

<button onclick="addCharacter(data.units.find(u=>u.id=='${unit.id}')
.chapters.find(c=>c.id=='${chapter.id}')
.sections.find(s=>s.id=='${section.id}'))">

+ Character

</button>

`;

section.characters.forEach(char=>{

const row=document.createElement("div");

row.className="character";

row.innerHTML=`

<input placeholder="Character"

value="${char.char}"

oninput="arguments[0]">

<input placeholder="Pinyin"

value="${char.pinyin}"

oninput="arguments[0]">

<input placeholder="Meaning"

value="${char.meaning}"

oninput="arguments[0]">

`;

const inputs=row.querySelectorAll("input");

inputs[0].oninput=e=>char.char=e.target.value;
inputs[1].oninput=e=>char.pinyin=e.target.value;
inputs[2].oninput=e=>char.meaning=e.target.value;

sec.appendChild(row);

});

chap.appendChild(sec);

});

unitDiv.appendChild(chap);

});

editor.appendChild(unitDiv);

});

}

function exportJSON(){

removeSentenceAndTranslationFields(data);

const blob=new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="data.json";

a.click();

}

render();

</script>

</body>
</html>
